<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1190" viewBox="0 0 1780 1190" role="img" aria-labelledby="title desc">
  <title id="title">Open Alert 后端架构：当前实现</title>
  <desc id="desc">浏览器通过 Cloudflare Worker 访问认证与业务 API。单例 Durable Object 调度行情和告警，D1 保存业务数据、租约及 Outbox。交易所直连与可选 Binance 永续中转提供行情，Pushover 发送通知。TradingView 仅用于显示。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#dce4e1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#41665e"/></marker>
    <marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#84948f"/></marker>
    <style>
      text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#193e35}
      .title{font-size:36px;font-weight:700;letter-spacing:-1px}.subtitle{font-size:17px;fill:#567268}
      .eyebrow{font-family:Consolas,monospace;font-size:13px;letter-spacing:2px;fill:#54766c}
      .heading{font-size:21px;font-weight:700}.body{font-size:16px;fill:#47675d}.small{font-size:14px;fill:#5d7b71}
      .mono{font-family:Consolas,monospace;font-size:15px}.card{fill:#fffefa;stroke:#b5cbc2;stroke-width:1.3}
      .wire{fill:none;stroke:#41665e;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}
      .optional{fill:none;stroke:#84948f;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#muted)}
      .label{font-size:14px;fill:#47675d;paint-order:stroke;stroke:#f4f7f1;stroke-width:7px;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1780" height="1190" fill="#f4f7f1"/><rect width="1780" height="1190" fill="url(#grid)" opacity=".6"/>
  <text x="60" y="45" class="eyebrow">OPEN ALERT / ENGINEERING MAP / 2026-10-19</text>
  <text x="60" y="92" class="title">不是微服务集群，而是一套双运行时的模块化单体。</text>
  <text x="60" y="124" class="subtitle">主图：Cloudflare 路径 · 基于 5874f03 的 2026-10-19 优化 · 虚线表示可选或仅展示链路</text>
  <rect x="370" y="155" width="850" height="827" rx="24" fill="#e9f1ea" stroke="#aac4b6"/>
  <text x="395" y="184" class="eyebrow">CLOUDFLARE / APPLICATION BOUNDARY</text>

  <rect x="60" y="220" width="260" height="152" rx="14" class="card"/>
  <text x="82" y="255" class="heading">浏览器 · React / Vite</text>
  <text x="82" y="289" class="body">登录、规则编辑、状态查看</text>
  <text x="82" y="316" class="body">同源 Cookie / generation 校验</text>
  <text x="82" y="345" class="small">浏览器关闭后，监控应继续运行</text>

  <rect x="400" y="220" width="300" height="260" rx="14" class="card"/>
  <text x="422" y="254" class="heading">Worker · HTTP 入口</text>
  <text x="422" y="284" class="body">静态资源 ASSETS / SPA</text>
  <line x1="422" y1="303" x2="678" y2="303" stroke="#d7e2d9"/>
  <text x="422" y="334" class="body">Hono API / 输入校验 / 租户隔离</text>
  <text x="422" y="364" class="body">Better Auth / Google / 邮箱 OTP</text>
  <text x="422" y="394" class="body">认证限流 / 业务限流 / CAS</text>
  <text x="422" y="452" class="small">目录响应流转发，不重复解析全量目录</text>

  <rect x="800" y="220" width="390" height="496" rx="14" fill="#174b3d"/>
  <text x="823" y="254" style="fill:#f4f8ed;font-size:21px;font-weight:700">Coordinator · Durable Object</text>
  <text x="823" y="282" style="fill:#b9d6c6;font:15px Consolas,monospace">singleton: coordinator-v1</text>
  <rect x="823" y="305" width="344" height="79" rx="9" fill="#f7faf0"/>
  <text x="841" y="333" class="heading" style="font-size:18px">目录缓存 + 独立展示报价</text>
  <text x="841" y="360" class="small">目录约 1h TTL；报价 5s 缓存，不驱动告警</text>
  <rect x="823" y="400" width="344" height="91" rx="9" fill="#f7faf0"/>
  <text x="841" y="430" class="heading" style="font-size:18px">行情采集 → 阈值评估</text>
  <text x="841" y="458" class="small">仅采集有效规则需求；拒绝过期/未来行情</text>
  <rect x="823" y="507" width="344" height="91" rx="9" fill="#f7faf0"/>
  <text x="841" y="537" class="heading" style="font-size:18px">持久化触发 → Outbox 投递</text>
  <text x="841" y="565" class="small">原子锁定规则；先提交发送占用，再调用提供方</text>
  <text x="823" y="632" style="fill:#e6efdf;font-size:16px">有工作时：alarm 目标间隔 5s</text>
  <text x="823" y="661" style="fill:#b9d6c6;font-size:15px">无工作时移除 alarm；无常驻定时器</text>
  <text x="823" y="689" style="fill:#b9d6c6;font-size:14px">每轮最多预留 4 条 / 串行发送 4 条</text>

  <rect x="60" y="435" width="260" height="112" rx="14" class="card"/>
  <text x="82" y="471" class="heading">TradingView 组件</text>
  <text x="82" y="501" class="body">仅展示图表 · 保持原组件</text>
  <text x="82" y="527" class="small">绝不作为后端告警价格来源</text>

  <rect x="60" y="645" width="260" height="150" rx="14" class="card"/>
  <text x="82" y="680" class="heading">身份与邮件提供方</text>
  <text x="82" y="714" class="body">Google OAuth</text>
  <text x="82" y="743" class="body">Resend · Cloudflare 邮箱 OTP</text>
  <text x="82" y="772" class="small">Node 还支持 SMTP 适配器</text>
  <rect x="60" y="840" width="260" height="113" rx="14" fill="#fbf1d7" stroke="#d5bc7d"/>
  <text x="82" y="874" class="heading" style="font-size:19px">独立 Cron · 每分钟</text>
  <text x="82" y="904" class="body">核对工作、补设 alarm</text>
  <text x="82" y="932" class="small">空闲不抓行情、不发送通知</text>

  <rect x="1310" y="220" width="410" height="135" rx="14" class="card"/>
  <text x="1334" y="255" class="heading">交易所公共行情 · 直连</text>
  <text x="1334" y="291" class="body">OKX / MEXC：现货 + USDT 永续</text>
  <text x="1334" y="321" class="body">Binance：现货；未配中转时永续也直连</text>

  <rect x="1310" y="417" width="410" height="100" rx="14" fill="#fbf1d7" stroke="#d5bc7d"/>
  <text x="1334" y="451" class="heading">可选 Vercel Relay · 东京</text>
  <text x="1334" y="484" class="body">Bearer 鉴权 / 固定上游 / 每批最多 8 个品种</text>
  <rect x="1310" y="568" width="410" height="73" rx="14" class="card"/>
  <text x="1334" y="599" class="heading">Binance USDT 永续 · fapi</text>
  <text x="1334" y="625" class="small">只中转行情，不中转账户、交易或下单</text>

  <rect x="1310" y="730" width="410" height="112" rx="14" class="card"/>
  <text x="1334" y="766" class="heading">Pushover → 用户设备</text>
  <text x="1334" y="798" class="body">明确拒绝可有限重试；结果不明标记 uncertain</text>
  <text x="1334" y="824" class="small">避免超时后自动重发造成重复通知</text>

  <rect x="400" y="815" width="790" height="138" rx="14" class="card"/>
  <text x="423" y="849" class="heading">D1 · 持久化事实源</text>
  <text x="423" y="885" class="body">用户 / 会话 / 邀请 / 限流　｜　规则 / 设置 / 加密通知凭据</text>
  <text x="423" y="920" class="body">scheduler_lease + fencing　｜　SQL Outbox / 发送配额 / 结果</text>

  <path d="M320 272H400" class="wire"/><text x="337" y="258" class="label">HTTPS</text>
  <path d="M190 372V435" class="optional"/>
  <path d="M700 330H800" class="wire"/><text x="727" y="313" class="label">内部调用</text>
  <path d="M550 480V815" class="wire"/><text x="565" y="746" class="label">认证 / 业务写入</text>
  <path d="M995 716V815" class="wire"/><text x="1010" y="774" class="label">原子预留 / lease / Outbox</text>
  <path d="M400 365H350V700H320" class="wire"/>
  <path d="M1190 287H1310" class="wire"/><text x="1211" y="272" class="label">CCXT / REST</text>
  <path d="M1190 467H1310" class="optional"/>
  <path d="M1515 517V568" class="wire"/>
  <path d="M1190 552H1250V776H1310" class="wire"/>
  <path d="M320 895H350V745H760V632H800" class="wire"/>

  <rect x="60" y="1008" width="1660" height="119" rx="14" fill="#e5ebec" stroke="#bbcbd0"/>
  <text x="84" y="1045" class="heading">可选部署，不与上图同时必需：Node 运行时</text>
  <text x="84" y="1078" class="body">Hono HTTP + 相同认证/仓储/调度内核　→　SQLite 或 PostgreSQL　→　CCXT Pro WebSocket + 5s 常驻调度　→　Pushover</text>
  <text x="84" y="1105" class="small">不是另一个微服务，也不是生产 Cloudflare 旁边的额外守护进程。当前代码没有 Redis、Kafka 或 Cloudflare Queues。</text>
  <text x="60" y="1164" class="small">优化：wake 有界重试 + 待确认提示；独立 Cron 补偿 alarm（须部署启用）。5s 不是通知 SLA。详见 backend-optimizations.md。</text>
</svg>
