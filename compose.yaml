services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DEPLOYMENT: node
      DB_DRIVER: sqlite
      SQLITE_PATH: /data/open-alert.sqlite
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["sqlite-data:/data"]
  app-postgres:
    profiles: ["postgres"]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DEPLOYMENT: node
      DB_DRIVER: postgres
      DATABASE_URL: postgres://openalert:${POSTGRES_PASSWORD:-}@postgres:5432/openalert
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:3001:3000"]
  postgres:
    profiles: ["postgres"]
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: openalert
      POSTGRES_DB: openalert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openalert -d openalert"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sqlite-data:
  postgres-data:
